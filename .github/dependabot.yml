# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    # Hold new releases a few days so a hijacked publish is pulled before it is
    # proposed. Security updates bypass this.
    cooldown:
      default-days: 5
    groups:
      actions:
        patterns:
          - "*"
    commit-message:
      prefix: "ci"
    labels:
      - "dependencies"
      - "github-actions"

  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 5
      semver-major-days: 14
    # One PR for minor and patch bumps, so pytest-homeassistant-custom-component
    # and homeassistant-stubs move to a new HA release together. Majors still
    # arrive one PR each.
    groups:
      pip:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    commit-message:
      prefix: "chore"
    labels:
      - "dependencies"
      - "python"
