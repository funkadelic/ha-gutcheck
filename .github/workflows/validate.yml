name: Validate

on:
  # hacs/action resolves the branch itself rather than a merge ref, so a bare
  # push trigger only repeats what the pull_request run already covers.
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-hacs:
    runs-on: "ubuntu-latest"
    steps:
      # Pinned to a commit rather than @main so a repointed branch cannot
      # change what runs here; refresh by hand when HACS validation needs to move.
      - name: HACS validation
        uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa # main as of 2026-06-08
        with:
          category: "integration"
