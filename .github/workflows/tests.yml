name: Tests
permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    # Job-level env reaches every step, including pip install and pytest, where
    # a compromised dependency could read it. Only the boolean lives here; the
    # token is scoped to the scan step below.
    env:
      HAS_SONAR_TOKEN: ${{ secrets.SONAR_TOKEN != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-test.txt

      - name: Install dependencies
        run: pip install -r requirements-test.txt

      # junit_family=legacy keeps the file and line attributes on each testcase
      # that pytest's default xunit2 drops. Codecov Test Analytics attributes a
      # test to a source file by them, so without it the flake and failure views
      # cannot name where a test lives.
      - name: Run tests with pytest
        run: pytest --cov-report=xml --junitxml=junit.xml -o junit_family=legacy

      - name: SonarQube Scan
        if: >-
          ${{ env.HAS_SONAR_TOKEN == 'true'
          && !contains(github.event.pull_request.labels.*.name, 'autorelease: pending') }}
        uses: SonarSource/sonarqube-scan-action@ba9859eae8dd6bd29e412f25ddbbef3d032000f4 # v8.2.2
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      # !cancelled() so a failing suite still reports its coverage, matching the
      # test-results upload below.
      - name: Upload coverage to Codecov
        if: >-
          ${{ !cancelled()
          && !contains(github.event.pull_request.labels.*.name, 'autorelease: pending') }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload test results to Codecov
        if: >-
          ${{ !cancelled()
          && !contains(github.event.pull_request.labels.*.name, 'autorelease: pending') }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: ./junit.xml
          report_type: test_results
          token: ${{ secrets.CODECOV_TOKEN }}

      # The README's test-count badge reads a gist, so only pushes to main update it.
      # GIST_TOKEN is a personal access token with the gist scope.
      - name: Count tests
        id: test-count
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
        run: |
          if [ -z "$GIST_TOKEN" ]; then
            echo "GIST_TOKEN is not set; leaving the badge at its last value."
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "publish=true" >> "$GITHUB_OUTPUT"
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import xml.etree.ElementTree as ET

          suites = ET.parse("junit.xml").getroot().iter("testsuite")
          print(f"count={sum(int(s.get('tests', 0)) for s in suites)}")
          PY

      - name: Publish the test-count badge
        if: ${{ steps.test-count.outputs.publish == 'true' }}
        uses: schneegans/dynamic-badges-action@28b0fa8bdeb46170ac397105ece0c1fe58f68910 # v1.9.0
        with:
          auth: ${{ secrets.GIST_TOKEN }}
          gistID: e814bc9b80ce48781f29b860011051d9
          filename: ha-gutcheck-tests.json
          label: tests
          message: ${{ steps.test-count.outputs.count }}
          color: blue
