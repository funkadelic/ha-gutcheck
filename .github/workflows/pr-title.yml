name: Lint PR Title

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  pr-title:
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@2252a14e810aa9b85c2d560bd7070c802206ecf6 # v6.1.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            perf
            refactor
            docs
            test
            build
            ci
            chore
          requireScope: false
          subjectPattern: ^[a-z](?:.*[^.])?$
          subjectPatternError: |
            PR title subject must start with a lowercase letter and not end with a period.
            Release-please parses squash-merge subjects; non-conventional titles silently skip releases.
            Allowed types: feat, fix, perf, refactor, docs, test, build, ci, chore.
            Example: "fix: handle empty payload from the health recipe"
