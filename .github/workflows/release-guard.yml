name: Release PR guard

# Fails a release-please pull request that would move the project backwards.
#
# When release-please resolves the latest release to a commit that is not on
# main (a surviving pre-release tag for an already-shipped version does this),
# it replays the whole history and rewrites the version downwards, reporting
# success while it does. That makes it a red check rather than a clean merge.

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  guard:
    # Only release-please's own branches; a human editing the manifest by hand
    # is not this job's business.
    if: startsWith(github.head_ref, 'release-please--branches--')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Both sides of every comparison are read from git, so the base commit
          # has to be in the clone.
          fetch-depth: 0
          persist-credentials: false

      - name: The release version must not go backwards
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          set -euo pipefail
          git show "$BASE_SHA:.release-please-manifest.json" > "$RUNNER_TEMP/base-manifest.json"
          python3 - "$RUNNER_TEMP/base-manifest.json" <<'PY'
          import json
          import os
          import re
          import sys


          def version_of(path):
              """Return the root package's version from a release-please manifest."""
              with open(path) as handle:
                  manifest = json.load(handle)
              version = manifest.get(".")
              if not isinstance(version, str):
                  sys.exit(f"::error::{path} carries no root package version")
              return version


          def sortable(version):
              """Return the numeric triple, which is all this comparison needs."""
              match = re.match(r"^(\d+)\.(\d+)\.(\d+)", version)
              if not match:
                  sys.exit(f"::error::Could not read a version number from '{version}'")
              return tuple(int(part) for part in match.groups())


          base = version_of(sys.argv[1])
          head = version_of(".release-please-manifest.json")
          print(f"base {base} -> head {head}")

          if sortable(head) < sortable(base):
              sys.exit(
                  f"::error::This release PR would move the version backwards, from {base} to {head}. "
                  "release-please has most likely resolved the latest release to a commit that is not on "
                  "main, which happens when a pre-release tag for an already-shipped version is still "
                  "published. Check the release-please run log for the sha it started from, and do not "
                  "merge this PR until the version is right."
              )

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write(f"Release version {base} to {head}, no regression.\n")
          PY

      - name: The changelog's newest entry must be the version being released
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import re
          import sys

          with open(".release-please-manifest.json") as handle:
              version = json.load(handle).get(".")

          with open("CHANGELOG.md") as handle:
              headings = re.findall(r"^## \[?([0-9][^\]\s]*)", handle.read(), re.MULTILINE)

          if not headings:
              sys.exit("::error::CHANGELOG.md carries no version headings at all")

          if headings[0] != version:
              sys.exit(
                  f"::error::The changelog's newest entry is {headings[0]} but the manifest says {version}. "
                  "The two are written by the same run, so they disagreeing means the release PR was built "
                  "from something other than this branch's history."
              )

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write(f"Changelog's newest entry is {headings[0]}, matching the manifest.\n")
          PY

      - name: The changelog must only gain entries
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          set -euo pipefail
          # release-please only ever prepends, so a release PR that deletes
          # changelog lines is rebuilding history rather than adding to it.
          removed="$(git diff --numstat "$BASE_SHA" HEAD -- CHANGELOG.md | awk '{print $2}')"
          removed="${removed:-0}"
          echo "changelog lines removed: $removed"
          if [ "$removed" != "0" ]; then
            echo "::error::This release PR removes $removed line(s) from CHANGELOG.md. release-please only ever prepends, so this is a rebuilt changelog rather than a new entry. Do not merge it."
            exit 1
          fi
          echo "CHANGELOG.md gains entries only." >> "$GITHUB_STEP_SUMMARY"
