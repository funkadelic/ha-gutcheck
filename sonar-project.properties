# SonarQube project configuration for Gut Check

sonar.projectKey=funkadelic_ha-gutcheck
sonar.organization=funkadelic
sonar.projectName=Gut Check

# A properties value runs to end of line, so a trailing marker would land inside
# the version string. These block markers stay real comments.
# x-release-please-start-version
sonar.projectVersion=0.7.0
# x-release-please-end

sonar.sources=custom_components/gutcheck
sonar.tests=tests
sonar.test.inclusions=tests/**/*

# Sonar cannot parse the brand images as UTF-8 source
sonar.exclusions=custom_components/gutcheck/brand/**

sonar.cpd.exclusions=tests/**/*

sonar.python.version=3.14
sonar.python.coverage.reportPaths=coverage.xml
sonar.sourceEncoding=UTF-8

# Home Assistant calls these platform hooks positionally and awaits them, so the
# signature and the async keyword are fixed by the platform.
sonar.issue.ignore.multicriteria=e1,e2,e3,e4,e5,e6
sonar.issue.ignore.multicriteria.e1.ruleKey=python:S1172
sonar.issue.ignore.multicriteria.e1.resourceKey=custom_components/gutcheck/diagnostics.py
sonar.issue.ignore.multicriteria.e2.ruleKey=python:S7503
sonar.issue.ignore.multicriteria.e2.resourceKey=custom_components/gutcheck/diagnostics.py
sonar.issue.ignore.multicriteria.e3.ruleKey=python:S1172
sonar.issue.ignore.multicriteria.e3.resourceKey=custom_components/gutcheck/button.py
sonar.issue.ignore.multicriteria.e4.ruleKey=python:S7503
sonar.issue.ignore.multicriteria.e4.resourceKey=custom_components/gutcheck/button.py
sonar.issue.ignore.multicriteria.e5.ruleKey=python:S1172
sonar.issue.ignore.multicriteria.e5.resourceKey=custom_components/gutcheck/sensor.py
sonar.issue.ignore.multicriteria.e6.ruleKey=python:S7503
sonar.issue.ignore.multicriteria.e6.resourceKey=custom_components/gutcheck/sensor.py
