# SonarQube project configuration for Gut Check

sonar.projectKey=funkadelic_ha-gutcheck
sonar.organization=funkadelic
sonar.projectName=Gut Check

# A properties value runs to end of line, so a trailing marker would land inside
# the version string. These block markers stay real comments.
# x-release-please-start-version
sonar.projectVersion=0.3.0
# x-release-please-end

sonar.sources=custom_components/gutcheck
sonar.tests=tests
sonar.test.inclusions=tests/**/*

# Sonar cannot parse the brand images as UTF-8 source
sonar.exclusions=custom_components/gutcheck/brand/**

sonar.cpd.exclusions=tests/**/*

sonar.python.version=3.14
sonar.python.coverage.reportPaths=coverage.xml
sonar.sourceEncoding=UTF-8

# Home Assistant calls async_get_config_entry_diagnostics(hass, entry) positionally
# and awaits it, so the signature and the async keyword are fixed by the platform.
sonar.issue.ignore.multicriteria=e1,e2
sonar.issue.ignore.multicriteria.e1.ruleKey=python:S1172
sonar.issue.ignore.multicriteria.e1.resourceKey=custom_components/gutcheck/diagnostics.py
sonar.issue.ignore.multicriteria.e2.ruleKey=python:S7503
sonar.issue.ignore.multicriteria.e2.resourceKey=custom_components/gutcheck/diagnostics.py
